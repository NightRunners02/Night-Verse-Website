<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="nvGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="#020617"/>
  <rect width="96" height="96" x="2" y="2" rx="24" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#nvGradient)" stroke-width="4" opacity="0.6"/>
  <!-- Stylized NightVerse "N" -->
  <path d="M36 68 V32 L64 68 V32" fill="none" stroke="url(#nvGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="70" cy="28" r="4" fill="#06b6d4"/>
</svg>
